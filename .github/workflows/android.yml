name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Build web app and Android project
        run: |
          set -o pipefail
          (npm install && npm run build && npx cap add android && node scripts/android-setup.mjs && npx cap sync android) 2>&1 | tee build.log
      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug 2>&1 | tee ../gradle.log
      - name: Publish APK to the "apk" branch
        run: |
          mkdir /tmp/out && cp android/app/build/outputs/apk/debug/app-debug.apk /tmp/out/sweet-spot-trading-journal.apk
          cd /tmp/out && git init -q -b apk && git config user.name "build" && git config user.email "build@users.noreply.github.com"
          git add . && git commit -qm "APK build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
      - name: Publish build log on failure
        if: failure()
        run: |
          mkdir /tmp/out && (tail -n 120 build.log; echo ------; tail -n 120 gradle.log) > /tmp/out/build-failed.txt 2>/dev/null || true
          cd /tmp/out && git init -q -b apk && git config user.name "build" && git config user.email "build@users.noreply.github.com"
          git add . && git commit -qm "build failed" && git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk
